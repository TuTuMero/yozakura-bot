<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜桜高校 | Ficha de Admisión</title>
    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #0f0a12;
            --card-bg: rgba(22, 14, 28, 0.85);
            --primary-pink: #ff65a3;
            --sakura-glow: #e0407b;
            --accent-purple: #2a1138;
            --text-light: #fcebf2;
            --text-muted: #b8a3b3;
            --border-pink: rgba(255, 101, 163, 0.3);
            --input-bg: rgba(12, 6, 16, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(224, 64, 123, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(42, 17, 56, 0.8) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 1px solid var(--border-pink);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 101, 163, 0.15);
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        /* Banner Header */
        .banner-header {
            position: relative;
            width: 100%;
            height: 180px;
            background: linear-gradient(180deg, rgba(15, 10, 18, 0.2) 0%, var(--card-bg) 100%),
                        url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1000&auto=format&fit=crop') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-pink);
        }

        .banner-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 12px var(--sakura-glow), 0 2px 5px rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 2px;
        }

        .banner-subtitle {
            font-size: 0.85rem;
            color: var(--primary-pink);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Form Styling */
        form {
            padding: 30px 25px;
        }

        .section-box {
            background: rgba(35, 20, 45, 0.4);
            border: 1px solid var(--border-pink);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
            position: relative;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--primary-pink);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 101, 163, 0.2);
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            background: var(--input-bg);
            border: 1px solid var(--border-pink);
            border-radius: 8px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 10px rgba(255, 101, 163, 0.3);
            background: rgba(18, 9, 24, 0.9);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .read-only-input {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--primary-pink);
            font-weight: 600;
            cursor: not-allowed;
        }

        /* Buttons & Footer */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--sakura-glow) 0%, var(--primary-pink) 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 16px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(224, 64, 123, 0.4);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(224, 64, 123, 0.6);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            form {
                padding: 15px;
            }
            .banner-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header visual inspirado en el banner -->
    <div class="banner-header">
        <div class="banner-title">
            <span>🌸</span> 夜桜高校 | Instituto Yozakura
        </div>
        <div class="banner-subtitle">Ficha de Admisión Oficial</div>
    </div>

    <form id="fichaForm">
        <!-- SECCIÓN 1: DATOS DEL ALUMNO -->
        <div class="section-box">
            <div class="section-title">
                <i class="fa-solid fa-graduation-cap"></i> Ⅰ. Datos del Alumno
            </div>
            <div class="form-grid">
                <div class="input-group">
                    <label>Nombre del Personaje</label>
                    <input type="text" id="nombre_pj" placeholder="Ej: Kenji Sato" required>
                </div>
                <div class="input-group">
                    <label>Edad</label>
                    <input type="number" id="edad_pj" min="14" max="25" placeholder="Ej: 16" required>
                </div>
                <div class="input-group">
                    <label>Género</label>
                    <select id="genero_pj" required>
                        <option value="" disabled selected>Selecciona género</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="No Binarie / Otro">No Binarie / Otro</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Curso / Año</label>
                    <select id="curso_pj" required>
                        <option value="" disabled selected>Selecciona curso</option>
                        <option value="1er Año (Clase 1-A)">1er Año (Clase 1-A)</option>
                        <option value="1er Año (Clase 1-B)">1er Año (Clase 1-B)</option>
                        <option value="2do Año (Clase 2-A)">2do Año (Clase 2-A)</option>
                        <option value="2do Año (Clase 2-B)">2do Año (Clase 2-B)</option>
                        <option value="3er Año (Clase 3-A)">3er Año (Clase 3-A)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: PERFIL DEL ALUMNO -->
        <div class="section-box">
            <div class="section-title">
                <i class="fa-solid fa-user-ninja"></i> Ⅱ. Perfil del Personaje
            </div>
            <div class="form-grid">
                <div class="input-group full-width">
                    <label><i class="fa-solid fa-image"></i> Apariencia (Adjunta la foto de tu personaje)</label>
                    <input type="file" id="apariencia_file" accept="image/*" required>
                    <small style="color: var(--text-muted); font-size: 0.75rem; margin-top: 4px;">Formatos permitidos: PNG, JPG, WEBP.</small>
                </div>
                <div class="input-group full-width">
                    <label>Personalidad</label>
                    <textarea id="personalidad_pj" placeholder="Describe cómo se comporta, sus actitudes, forma de hablar..." required></textarea>
                </div>
                <div class="input-group full-width">
                    <label>Gustos y Disgustos</label>
                    <textarea id="gustos_pj" placeholder="Le gusta el té, practicar Kendo... Le disgusta la impuntualidad..." required></textarea>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 3: HISTORIA DEL PERSONAJE -->
        <div class="section-box">
            <div class="section-title">
                <i class="fa-solid fa-book-open"></i> Ⅲ. Historia del Personaje (Lore)
            </div>
            <div class="input-group">
                <label>Historia / Pasado</label>
                <textarea id="historia_pj" style="min-height: 120px;" placeholder="Cuenta el trasfondo de tu personaje y cómo llegó a ser admitido en el Instituto Yozakura..." required></textarea>
            </div>
        </div>

        <!-- SECCIÓN 4: DATOS DEL USUARIO -->
        <div class="section-box">
            <div class="section-title">
                <i class="fa-solid fa-id-card"></i> Ⅳ. Datos del Usuario
            </div>
            <div class="form-grid">
                <div class="input-group">
                    <label>ID de Discord</label>
                    <input type="text" id="discord_id" class="read-only-input" readonly placeholder="Cargando ID...">
                </div>
                <div class="input-group">
                    <label>Usuario de Roblox</label>
                    <input type="text" id="roblox_username" class="read-only-input" readonly placeholder="Cargando Roblox...">
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
            <i class="fa-solid fa-paper-plane"></i> Enviar Ficha de Admisión
        </button>
    </form>
</div>

<script>
    // 1. CREDENCIALES DE SUPABASE
    const SUPABASE_URL = 'https://nvyltyrykclvljhwqkvm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52eWx0eXJ5a2NsdmxqaHdxa3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NzkzMTYsImV4cCI6MjEwMjQ1NTMxNn0.-OxRI1ZsNCJny6QalyUrv9NfdJT8DektXn0sNCEuQTg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. Obtener el parámetro 'discord_id' desde la URL
    const urlParams = new URLSearchParams(window.location.search);
    const discordIdParam = urlParams.get('discord_id');

    document.addEventListener('DOMContentLoaded', async () => {
        const discordInput = document.getElementById('discord_id');
        const robloxInput = document.getElementById('roblox_username');

        if (!discordIdParam) {
            alert('⚠️ Error: No se detectó tu ID de Discord. Abre este enlace desde el botón del servidor.');
            return;
        }

        // Asignar Discord ID al input correspondiente
        discordInput.value = discordIdParam;

        // Consultar la tabla 'users' en Supabase para autocompletar el 'roblox_username'
        const { data, error } = await supabaseClient
            .from('users')
            .select('roblox_username')
            .eq('discord_id', discordIdParam)
            .maybeSingle();

        if (error) {
            console.error('Error al buscar usuario en la base de datos:', error.message);
        }

        if (data && data.roblox_username) {
            robloxInput.value = data.roblox_username;
        } else {
            robloxInput.value = "No verificado";
            robloxInput.style.color = "#ff65a3";
        }
    });

    // 3. Manejador del Envío del Formulario
    document.getElementById('fichaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const fileInput = document.getElementById('apariencia_file');

        if (fileInput.files.length === 0) {
            alert('⚠️ Por favor selecciona una imagen para la apariencia de tu personaje.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Subiendo imagen y enviando...';

        try {
            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
            const filePath = `apariencias/${fileName}`;

            // A. Subir la imagen al bucket 'fichas-imagenes' de Supabase Storage
            const { data: uploadData, error: uploadError } = await supabaseClient.storage
                .from('fichas-imagenes')
                .upload(filePath, file);

            if (uploadError) {
                throw new Error('Error al subir la imagen: ' + uploadError.message);
            }

            // B. Generar la URL pública de la imagen
            const { data: urlData } = supabaseClient.storage
                .from('fichas-imagenes')
                .getPublicUrl(filePath);

            const publicImageUrl = urlData.publicUrl;

            // C. Insertar los datos en la tabla 'fichas'
            const payload = {
                discord_id: document.getElementById('discord_id').value,
                roblox_username: document.getElementById('roblox_username').value,
                nombre_pj: document.getElementById('nombre_pj').value,
                edad_pj: parseInt(document.getElementById('edad_pj').value),
                genero_pj: document.getElementById('genero_pj').value,
                curso_pj: document.getElementById('curso_pj').value,
                apariencia_pj: publicImageUrl,
                personalidad_pj: document.getElementById('personalidad_pj').value,
                gustos_pj: document.getElementById('gustos_pj').value,
                historia_pj: document.getElementById('historia_pj').value,
                estado: 'pendiente'
            };

            const { error: dbError } = await supabaseClient.from('fichas').insert([payload]);

            if (dbError) throw dbError;

            alert('🎉 ¡Tu Ficha de Admisión y su imagen se enviaron con éxito!');
            window.location.reload();

        } catch (err) {
            console.error(err);
            alert('❌ Ocurrió un error: ' + err.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar Ficha de Admisión';
        }
    });
</script>

</body>
</html>
